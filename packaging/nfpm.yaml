# Debian package for ZeroDesk, both editions (packaging/build-deb.sh).
# The layout follows the CardputerZero Store install-path policy.
name: zerodesk
arch: arm64
platform: linux
version: ${ZERODESK_VERSION}
release: ${ZERODESK_RELEASE}
section: APPLaunch
priority: optional
maintainer: ZeroDesk <richardhxwang@users.noreply.github.com>
description: |
  Your CardputerZero on a big screen, in your computer's or phone's browser.
  On a computer it is a desktop with windows, a Dock, Finder and Terminal;
  on a phone it is a home screen. Comes with an App Store, and the compass,
  GPS, camera, IR, LoRa and NFC run live in their own windows.
license: MIT
depends:
  - libcap2-bin
contents:
  # the edition's binary, copied here by build-deb.sh
  - src: ./build/zerodesk
    dst: /usr/bin/zerodesk
    file_info: { mode: 0755 }
  - src: zerodesk
    dst: /usr/bin/zerodesk-screen
    type: symlink
  - src: ./zerodesk.service
    dst: /usr/lib/systemd/system/zerodesk.service
    file_info: { mode: 0644 }
  - src: ./zerodesk.desktop
    dst: /usr/share/APPLaunch/applications/zerodesk.desktop
    file_info: { mode: 0644 }
  - src: ./build/zerodesk.png
    dst: /usr/share/APPLaunch/share/images/zerodesk.png
    file_info: { mode: 0644 }
  - src: ./build/apps
    dst: /usr/share/zerodesk/apps
    type: tree
  - src: ./build/zd_vfb.so
    dst: /usr/lib/zerodesk/zd_vfb.so
    file_info: { mode: 0644 }
  - src: ../LICENSE
    dst: /usr/share/doc/zerodesk/copyright
    file_info: { mode: 0644 }
  - src: ../THIRD_PARTY_NOTICES.md
    dst: /usr/share/doc/zerodesk/THIRD_PARTY_NOTICES.md
    file_info: { mode: 0644 }
  - src: ../README.md
    dst: /usr/share/doc/zerodesk/README.md
    file_info: { mode: 0644 }
scripts:
  preinstall: ./preinst.sh
  postinstall: ./postinst.sh
  preremove: ./prerm.sh
  postremove: ./postrm.sh
