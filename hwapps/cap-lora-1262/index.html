<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>LoRa</title>
		<link rel="stylesheet" href="_zd/sdk.css" />
		<link rel="stylesheet" href="app.css" />
		<script src="_zd/sdk.js"></script>
		<script src="app.js" defer></script>
	</head>
	<body>
		<div class="window">
			<header class="zd-toolbar" data-zd-drag>
				<div class="heading">
					<span class="zd-title" data-i18n="title">LoRa</span>
					<span class="zd-subtitle status" id="status"><i class="dot"></i><span id="status-text"></span></span>
				</div>
				<span class="zd-spacer"></span>
				<div class="zd-capsule">
					<button id="inspector" aria-pressed="false" data-i18n-title="details"><i class="zd-glyph">sidebar_right</i></button>
				</div>
			</header>
			<div class="body">
				<main>
					<div class="transcript" id="transcript"></div>
					<div class="zd-empty empty" id="empty" hidden>
						<i class="zd-glyph" id="empty-glyph">bubble_left_bubble_right</i>
						<h2 id="empty-title"></h2>
						<p id="empty-text"></p>
						<button class="zd-button" id="retry" data-i18n="retry" hidden>Try Again</button>
					</div>
					<footer class="composer">
						<div class="reply-bar" id="reply-bar" hidden>
							<i class="zd-glyph">arrowshape_turn_up_left</i>
							<div class="reply-body">
								<b id="reply-sender"></b>
								<span id="reply-text"></span>
							</div>
							<button class="icon-button" id="reply-cancel" data-i18n-title="cancel"><i class="zd-glyph">xmark_circle_fill</i></button>
						</div>
						<form class="input-row" id="form" autocomplete="off">
							<input class="zd-field" id="input" spellcheck="false" data-i18n-placeholder="placeholder" />
							<span class="count" id="count"></span>
							<button class="send" id="send" type="submit" data-i18n-title="send" disabled><i class="zd-glyph">arrow_up_circle_fill</i></button>
						</form>
					</footer>
				</main>
				<aside class="inspector" id="panel" hidden>
					<section>
						<h4 class="zd-section-title" data-i18n="nickname">Nickname</h4>
						<div class="zd-card">
							<div class="zd-row nick-row">
								<input class="nick" id="nick" maxlength="10" spellcheck="false" />
							</div>
						</div>
					</section>
					<section>
						<h4 class="zd-section-title" data-i18n="link">Link</h4>
						<div class="zd-card" id="link"></div>
					</section>
					<section>
						<h4 class="zd-section-title" data-i18n="radio">Radio</h4>
						<div class="zd-card" id="radio"></div>
					</section>
					<section>
						<h4 class="zd-section-title" data-i18n="hardware">Hardware</h4>
						<div class="zd-card" id="hardware"></div>
					</section>
				</aside>
			</div>
		</div>
		<div class="menu" id="menu" role="menu" hidden>
			<button data-act="reply" data-i18n="reply">Reply</button>
			<button data-act="copy" data-i18n="copy">Copy</button>
		</div>
	</body>
</html>
